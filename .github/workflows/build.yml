name: Build Cross-Platform App

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: School-map-windows.exe
          - os: ubuntu-latest
            artifact_name: School-map-linux
          - os: macos-latest
            artifact_name: School-map-macos

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.14'
      
    - name: Install dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Run PyInstaller
      shell: bash
      run: |
        pyinstaller -Fwn "SchoolMap.exe" main.py

    - name: Rename artifacts for Unix systems
      shell: bash
      run: |
        if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
          mv "dist/SchoolMap.exe" "dist/SchoolMap-linux"
        elif [ "${{ matrix.os }}" = "macos-latest" ]; then
          mv "dist/SchoolMap.exe" "dist/SchoolMap-macos"
        fi

    - name: Create Release and Upload Artifact
      uses: softprops/action-gh-release@v2
      with:
        files: dist/${{ matrix.artifact_name }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
